[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "Crypto Analysis"
version = "0.0.1"
description = "Project created for organizing and develop a crypto taxonomy analysis from pump.fun crypto data."
authors = [
  { name = "LoCuS - Social Computing Laboratory." },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["Crypto Analysis"]
include = ["pyproject.toml", "Crypto Analysis/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["Crypto Analysis"]
force-sort-within-sections = true

